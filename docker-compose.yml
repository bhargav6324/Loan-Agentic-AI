version: '3.8'

services:
  db:
    image: postgres:15
    container_name: loanai_postgres
    restart: always
    environment:
      POSTGRES_USER: loanai
      POSTGRES_PASSWORD: loanai123
      POSTGRES_DB: loanai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
